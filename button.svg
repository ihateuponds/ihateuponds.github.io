<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <defs>
    <style>
      .bg { fill: #0f1017; }
      .bevel-top { fill: #3f445f; }
      .bevel-bottom { fill: #050508; }
      .inner { fill: #131520; }
      .text-title { font-family: "Courier New", monospace; font-size: 8.5px; font-weight: bold; fill: #10b981; letter-spacing: -0.5px; }
      .text-sub { font-family: "Courier New", monospace; font-size: 7.5px; font-weight: bold; fill: #38bdf8; }
    </style>
  </defs>
  <!-- Outer Bevel -->
  <rect width="88" height="31" class="bevel-top"/>
  <rect x="1" y="1" width="86" height="29" class="bevel-bottom"/>
  <rect x="1" y="1" width="85" height="28" class="inner"/>
  
  <!-- Left Deco Box -->
  <rect x="3" y="3" width="22" height="24" fill="#090a0f" stroke="#2a2e45" stroke-width="1"/>
  <!-- Pixel Screen Icon -->
  <rect x="6" y="6" width="16" height="12" fill="#041a12" stroke="#10b981" stroke-width="1"/>
  <rect x="11" y="19" width="6" height="3" fill="#10b981"/>
  <rect x="9" y="22" width="10" height="2" fill="#38bdf8"/>
  <circle cx="9" cy="9" r="1" fill="#10b981"/>
  <line x1="12" y1="9" x2="18" y2="9" stroke="#10b981" stroke-width="1"/>
  <line x1="8" y1="12" x2="16" y2="12" stroke="#38bdf8" stroke-width="1"/>
  <line x1="8" y1="14" x2="13" y2="14" stroke="#10b981" stroke-width="1"/>

  <!-- Right Text Area -->
  <text x="29" y="13" class="text-title">ihateuponds</text>
  <rect x="29" y="17" width="54" height="9" fill="#090a0f" stroke="#222638" stroke-width="0.5"/>
  <text x="32" y="24" class="text-sub">TECH &amp; SYS</text>
</svg>
