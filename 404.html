<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 // TRANSMISSION VOID // PONDS.SYS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&family=Share+Tech+Mono&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .error-card {
      background: var(--bg-card);
      border: 3px double var(--neon-pink);
      box-shadow: 6px 6px 0 #000;
      padding: 36px 28px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .error-code {
      font-family: var(--font-pixel);
      font-size: 3rem;
      color: var(--neon-pink);
      text-shadow: 3px 3px 0 var(--neon-cyan);
    }
    .error-sprite {
      width: 110px;
      height: 110px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 10px var(--neon-purple));
    }
    .error-title {
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      color: var(--neon-cyan);
    }
    .error-desc {
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.6;
    }
    .error-btn-box {
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body class="crt-enabled">
  <div class="crt-layer active"></div>

  <div class="error-viewport">
    <div class="error-card">
      <div class="washi-tape pink-tape">ERROR_404.SYS</div>
      <div class="error-code">404</div>
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/94.gif" alt="Gengar Sprite" class="error-sprite" />
      <h1 class="error-title">TRANSMISSION VOID // SECTOR NOT FOUND</h1>
      <p class="error-desc">
        The requested cyberspace frequency does not exist or was purged into the shadow realm. Check your URL coordinates or return to the terminal root.
      </p>
      <div class="error-btn-box" style="display: flex; flex-direction: column; gap: 8px;">
        <a href="./" class="neon-link-btn" style="justify-content: center; text-align: center;">
          <span>[RETURN TO ROOT // PONDS.SYS]</span>
        </a>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 6px;">
          <a href="./about/" style="color: var(--neon-pink); font-family: var(--font-pixel); font-size: 0.6rem; text-decoration: none;">[ABOUT]</a>
          <a href="./posts/" style="color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 0.6rem; text-decoration: none;">[POSTS]</a>
          <a href="./games/" style="color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 0.6rem; text-decoration: none;">[GAMES]</a>
          <a href="./rig/" style="color: var(--neon-purple); font-family: var(--font-pixel); font-size: 0.6rem; text-decoration: none;">[RIG]</a>
          <a href="./lsd/" style="color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 0.6rem; text-decoration: none;">[LSD]</a>
          <a href="./guestbook/" style="color: var(--neon-pink); font-family: var(--font-pixel); font-size: 0.6rem; text-decoration: none;">[GUESTBOOK]</a>
          <a href="./support/" style="color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 0.6rem; text-decoration: none;">[SUPPORT]</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
